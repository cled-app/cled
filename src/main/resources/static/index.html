<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLED – club edit</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #e4f3df;
            color: white;
        }

        .uvodni-stranka {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            min-height: 100vh;
            padding: 5px;
        }

        .hlavni-cast {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-width: 0;
            padding: 24px;
            background: linear-gradient(135deg, #263b34, #182b25);
            border-left: 5px solid #a5d6c5;
            border-right: 3px solid #a5d6c5;
        }

        h1 {
            margin: 0 0 20px;
            color: #83e0b5;
            text-align: center;
            font-size: clamp(25px, 4vw, 46px);
            line-height: 1.2;
        }

        .logo {
            display: block;
            width: min(100%, 400px);
            height: auto;
            object-fit: contain;
        }

        .prihlasovaci-cast {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 22px;
            color: white;
            background: linear-gradient(160deg, #c8eac1, #9bcf83);
        }

        .nadpis-panelu {
            margin: 0 0 28px;
            padding: 9px 18px;
            border: 1px solid #547b49;
            background: #6fa75d;
            font-size: 16px;
            font-weight: normal;
        }

        form {
            width: 100%;
            max-width: 260px;
        }

        label {
            display: block;
            margin: 0 0 5px;
            font-size: 13px;
        }

        input {
            display: block;
            width: 100%;
            min-width: 0;
            margin-bottom: 18px;
            padding: 10px;
            border: 1px solid #668c5c;
            border-radius: 2px;
            background: #edf8e9;
            color: #243d28;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #477e42;
            outline-offset: 1px;
        }

        .tlacitko {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 11px;
            border: 1px solid #466e3d;
            border-radius: 2px;
            background: #6fa75d;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .tlacitko:hover {
            background: #578d48;
        }

        .pomocny-text {
            margin-top: 18px;
            color: #31532c;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 650px) {
            .uvodni-stranka {
                grid-template-columns: 1fr;
                padding: 0;
            }

            .hlavni-cast {
                min-height: 320px;
                padding: 28px 16px;
                border: none;
            }

            .logo {
                width: min(75%, 260px);
            }

            .prihlasovaci-cast {
                padding: 28px 22px 36px;
            }

            form {
                max-width: 340px;
            }
        }
    </style>
</head>

<body>
    <main class="uvodni-stranka">

        <section class="hlavni-cast">
            <h1>Vítejte v CLED – club edit</h1>

            <img
                src="images/icon.png"
                alt="Logo CLED"
                class="logo">
        </section>

        <section class="prihlasovaci-cast">
            <h2 class="nadpis-panelu">Přihlášení</h2>

            <form method="post" action="/login">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Zadejte e-mail"
                    autocomplete="username"
                    required>

                <label for="heslo">Heslo</label>
                <input
                    type="password"
                    id="heslo"
                    name="heslo"
                    placeholder="Zadejte heslo"
                    autocomplete="current-password"
                    required>

                <button class="tlacitko" type="submit">
                    Přihlásit
                </button>
            </form>

            <p class="pomocny-text">
                Správa sportovních klubů a svazů
            </p>
        </section>

    </main>
</body>

</html>
